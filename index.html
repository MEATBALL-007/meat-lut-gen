/* --------------------------------------------------------------------------
   5. DEFAULT TEST IMAGE — so the tool works before any upload.
      A gradient + colour swatches + a skin-tone patch to judge looks.
   -------------------------------------------------------------------------- */
function makeDefaultImage(){
  const c = document.createElement('canvas');
  c.width = 800; c.height = 500;
  const x = c.getContext('2d');
  // sky-to-ground vertical gradient
  const g = x.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#3a5a80'); g.addColorStop(.5,'#86756a'); g.addColorStop(1,'#241c16');
  x.fillStyle = g; x.fillRect(0,0,800,500);
  // greyscale ramp (to watch contrast / tone)
  for(let i=0;i<16;i++){
    const v = Math.round(i/15*255);
    x.fillStyle = `rgb(${v},${v},${v})`;
    x.fillRect(40 + i*44, 40, 44, 50);
  }
  // colour swatches
  const cols = ['#c0392b','#e67e22','#f1c40f','#27ae60','#16a085','#2980b9','#8e44ad'];
  cols.forEach((col,i)=>{ x.fillStyle=col; x.fillRect(40+i*100, 110, 100, 60); });
  // skin-tone patches (the thing LUTs must not wreck)
  const skins = ['#f1c6a8','#d9a07a','#a9745a','#5c3b2e'];
  skins.forEach((s,i)=>{ x.fillStyle=s; x.beginPath();
    x.arc(140+i*180, 330, 55, 0, Math.PI*2); x.fill(); });
  x.fillStyle='rgba(245,243,239,.85)';
  x.font='600 22px "Space Grotesk", sans-serif';
  x.fillText('LUT GEN · load your own image to grade', 40, 470);
  return c;
}

/* --------------------------------------------------------------------------
   6. CONTROL UI GENERATION
   -------------------------------------------------------------------------- */
/* ---------------------------------------------------------------------------
   DOCKED WORKSPACE (Premiere-style)
   Panels are tabbed FRAMES inside left/right dock COLUMNS, so you can stack many
   panels in one window and click a tab to switch. addSection() still returns a
   body element (unchanged contract); layoutPanels() distributes panels into
   frames per a default map or the saved layout. Drag a tab onto another frame to
   group it there, or onto a dock / the preview's left|right half to dock it.
   Every panel body stays attached (inactive tabs are display:none) so all the
   slider/refresh code keeps working regardless of which tab is showing.
   --------------------------------------------------------------------------- */
const PANELS = [];
const LAYOUT_KEY = 'meatlut.layout.v2';
const isNarrow = ()=> window.matchMedia('(max-width: 760px)').matches;

const DOCKS = {
  left:  { el: document.getElementById('dockLeft'),  resizer: document.getElementById('resizeLeft'),  frames: [] },
  right: { el: document.getElementById('dockRight'), resizer: document.getElementById('resizeRight'), frames: [] },
};
let frameSeq = 0;

// Default grouping (keys MUST match addSection titles exactly).
const DEFAULT_LAYOUT = {
  left: [
    ['Film Stock','Reference Match','Input — Source / Camera Log'],
    ['Scopes','Library — Media & Looks'],
  ],
  right: [
    ['White Balance','Tone','3-Way Color (Lift / Gamma / Gain)','Tone Curve'],
    ['HSL / Color Mixer','Saturation & Vibrance','Split Toning','Faded Black'],
    ['Variations','Export LUT','LUT Pack'],
  ],
};
// Short, friendly tab labels for the long section titles.
const TAB_NAMES = {
  'Input — Source / Camera Log':'Input', '3-Way Color (Lift / Gamma / Gain)':'3-Way',
  'Library — Media & Looks':'Library', 'Saturation & Vibrance':'Saturation',
  'HSL / Color Mixer':'HSL', 'Reference Match':'Ref Match', 'Tone Curve':'Curve',
};
const tabName  = k => TAB_NAMES[k] || k;
const panelByKey = k => PANELS.find(p=>p.key === k);
function defaultZoneOf(key){
  for(const z of ['left','right']) if(DEFAULT_LAYOUT[z].some(g=>g.includes(key))) return z;
  return 'right';
}

/* addSection: register a panel, return its (detached) body for control building. */
function addSection(title, open=false){
  const body = document.createElement('div'); body.className = 'panel-body';
  PANELS.push({ key:title, body, open:!!open, hidden:false, tabEl:null, frame:null });
  return body;
}

/* ---- frames -------------------------------------------------------------- */
function makeFrame(zone){
  const el = document.createElement('div'); el.className = 'frame';
  const tabs = document.createElement('div'); tabs.className = 'frame-tabs';
  const bodyHost = document.createElement('div'); bodyHost.className = 'frame-body';
  el.append(tabs, bodyHost);
  const fr = { id:'f'+(++frameSeq), zone, el, tabs, bodyHost, panels:[], active:null };
  DOCKS[zone].frames.push(fr); DOCKS[zone].el.appendChild(el);
  return fr;
}
function frameByEl(el){ for(const z of ['left','right']){ const fr = DOCKS[z].frames.find(f=>f.el === el); if(fr) return fr; } return null; }
function removeFrame(fr){ const a = DOCKS[fr.zone].frames, i = a.indexOf(fr); if(i>=0) a.splice(i,1); fr.el.remove(); }

function addPanelToFrame(fr, p, index){
  p.frame = fr;
  const tab = document.createElement('div'); tab.className = 'tab';
  const lab = document.createElement('span'); lab.textContent = tabName(p.key); tab.appendChild(lab);
  const x = document.createElement('span'); x.className = 'tx'; x.textContent = '✕'; x.title = 'Close panel'; tab.appendChild(x);
  p.tabEl = tab;
  tab.addEventListener('click', e=>{ if(e.target === x) return; activateTab(p); });
  x.addEventListener('click', e=>{ e.stopPropagation(); hidePanel(p); });
  enableTabDrag(p);
  if(index == null || index >= fr.panels.length){ fr.panels.push(p); fr.tabs.appendChild(tab); }
  else { fr.panels.splice(index, 0, p); fr.tabs.insertBefore(tab, fr.tabs.children[index]); }
  fr.bodyHost.appendChild(p.body);            // body stays attached; visibility via activateTab
  p.body.style.display = 'none';
}
function activateTab(p){
  const fr = p.frame; if(!fr) return; fr.active = p;
  fr.panels.forEach(q=>{ q.tabEl.classList.toggle('active', q === p); q.body.style.display = (q === p) ? '' : 'none'; });
  scopesDirty = true;
}
function removePanelFromFrame(p){
  const fr = p.frame; if(!fr) return;
  const i = fr.panels.indexOf(p); if(i >= 0) fr.panels.splice(i, 1);
  if(p.tabEl) p.tabEl.remove();
  if(p.body.parentNode) p.body.parentNode.removeChild(p.body);
  p.frame = null;
  if(fr.panels.length === 0) removeFrame(fr);
  else if(fr.active === p) activateTab(fr.panels[Math.min(i, fr.panels.length - 1)]);
}
function hidePanel(p){ removePanelFromFrame(p); p.hidden = true; updateDockEmptyState(); buildPanelsMenu(); saveLayout(); }
function showPanel(p){
  p.hidden = false; const zone = defaultZoneOf(p.key);
  const fr = DOCKS[zone].frames[0] || makeFrame(zone);
  addPanelToFrame(fr, p); activateTab(p);
  updateDockEmptyState(); buildPanelsMenu(); saveLayout();
}
function updateDockEmptyState(){
  for(const z of ['left','right']){
    const empty = DOCKS[z].frames.length === 0;
    DOCKS[z].el.classList.toggle('empty', empty);
    DOCKS[z].resizer.classList.toggle('hidden', empty);
  }
}

/* ---- tab drag & drop (group into a frame / dock to a side) --------------- */
let ghostEl = null;
function clearHighlights(){ document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target')); }
function dropInfoAt(x, y){
  const el = document.elementFromPoint(x, y); if(!el) return null;
  const frameEl = el.closest('.frame');
  if(frameEl){ const fr = frameByEl(frameEl); if(fr) return { type:'frame', fr }; }
  const dockEl = el.closest('.dock');
  if(dockEl) return { type:'dock', zone: dockEl === DOCKS.left.el ? 'left' : 'right' };
  const pv = document.getElementById('previewPane');
  if(pv && (el === pv || pv.contains(el))){ const r = pv.getBoundingClientRect();
    return { type:'dock', zone: x < r.left + r.width/2 ? 'left' : 'right' }; }
  return null;
}
function highlightTarget(x, y){
  clearHighlights(); const info = dropInfoAt(x, y); if(!info) return;
  if(info.type === 'frame') info.fr.el.classList.add('drop-target');
  else DOCKS[info.zone].el.classList.add('drop-target');
}
function enableTabDrag(p){
  p.tabEl.addEventListener('pointerdown', e=>{
    if(e.target.classList.contains('tx') || isNarrow() || e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let dragging = false;
    const move = ev=>{
      if(!dragging){ if(Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
        dragging = true; activateTab(p); p.tabEl.classList.add('dragging');
        ghostEl = document.createElement('div'); ghostEl.className = 'dock-ghost'; ghostEl.textContent = tabName(p.key);
        document.body.appendChild(ghostEl); }
      ghostEl.style.left = (ev.clientX + 10) + 'px'; ghostEl.style.top = (ev.clientY + 12) + 'px';
      highlightTarget(ev.clientX, ev.clientY);
    };
    const up = ev=>{
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      if(!dragging) return;
      p.tabEl.classList.remove('dragging'); if(ghostEl){ ghostEl.remove(); ghostEl = null; } clearHighlights();
      dropPanel(p, ev.clientX, ev.clientY);
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
    e.preventDefault();
  });
}
function dropPanel(p, x, y){
  const info = dropInfoAt(x, y); if(!info) return;
  if(info.type === 'frame'){
    if(info.fr === p.frame) return;                       // dropped on its own frame: no change
    const zone = info.fr.zone; removePanelFromFrame(p);
    let fr = info.fr;
    if(!DOCKS[zone].frames.includes(fr)) fr = makeFrame(zone);   // frame vanished (was source & emptied)
    addPanelToFrame(fr, p); activateTab(p);
  } else {                                                 // dock / preview edge -> new frame in that column
    if(p.frame && p.frame.panels.length === 1 && p.frame.zone === info.zone) return;  // already alone there
    removePanelFromFrame(p);
    const fr = makeFrame(info.zone); addPanelToFrame(fr, p); activateTab(p);
  }
  updateDockEmptyState(); buildPanelsMenu(); saveLayout();
}

/* ---- dock width resizing -------------------------------------------------- */
function enableDockResize(zone){
  DOCKS[zone].resizer.addEventListener('pointerdown', e=>{
    if(isNarrow()) return;
    const dock = DOCKS[zone].el, sx = e.clientX, sw = dock.getBoundingClientRect().width;
    const move = ev=>{ const w = zone === 'right' ? sw - (ev.clientX - sx) : sw + (ev.clientX - sx);
      dock.style.width = Math.max(210, Math.min(640, w)) + 'px'; };
    const up = ()=>{ document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); saveLayout(); };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
    e.preventDefault();
  });
}
enableDockResize('left'); enableDockResize('right');

/* ---- layout build / persistence ------------------------------------------ */
function clearDocks(){
  for(const z of ['left','right']){ DOCKS[z].frames.forEach(fr=>fr.el.remove()); DOCKS[z].frames = []; }
  PANELS.forEach(p=>{ p.frame = null; p.tabEl = null; if(p.body.parentNode) p.body.parentNode.removeChild(p.body); });
}
function buildDefaultLayout(){
  clearDocks(); PANELS.forEach(p=> p.hidden = false);
  for(const zone of ['left','right']){
    for(const group of DEFAULT_LAYOUT[zone]){
      const present = group.map(panelByKey).filter(Boolean);
      if(!present.length) continue;
      const fr = makeFrame(zone); present.forEach(p=> addPanelToFrame(fr, p));
      activateTab(present.find(p=>p.open) || present[0]);
    }
  }
  const rest = PANELS.filter(p=>!p.frame);              // any panel not in the map
  if(rest.length){ const fr = makeFrame('right'); rest.forEach(p=> addPanelToFrame(fr, p)); activateTab(rest[0]); }
  updateDockEmptyState();
}
function saveLayout(){
  const data = { docks:{}, widths:{}, hidden: PANELS.filter(p=>p.hidden).map(p=>p.key) };
  for(const z of ['left','right']){
    data.docks[z] = DOCKS[z].frames.map(fr=>({ keys: fr.panels.map(p=>p.key), active: fr.active ? fr.active.key : null }));
    if(DOCKS[z].el.style.width) data.widths[z] = DOCKS[z].el.style.width;
  }
  try{ localStorage.setItem(LAYOUT_KEY, JSON.stringify(data)); }catch(e){}
}
function restoreLayout(){
  let data; try{ data = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null'); }catch(e){}
  if(!data || !data.docks) return false;
  clearDocks();
  const hidden = new Set(data.hidden || []); PANELS.forEach(p=> p.hidden = hidden.has(p.key));
  for(const z of ['left','right']){
    for(const f of (data.docks[z] || [])){
      const present = (f.keys || []).map(panelByKey).filter(p=>p && !p.hidden);
      if(!present.length) continue;
      const fr = makeFrame(z); present.forEach(p=> addPanelToFrame(fr, p));
      activateTab(present.find(p=>p.key === f.active) || present[0]);
    }
    if(data.widths[z]) DOCKS[z].el.style.width = data.widths[z];
  }
  // panels added in a newer build than the saved layout -> dock them by default
  for(const p of PANELS.filter(q=>!q.hidden && !q.frame)){
    const zone = defaultZoneOf(p.key); const fr = DOCKS[zone].frames[0] || makeFrame(zone);
    addPanelToFrame(fr, p); if(!fr.active) activateTab(p);
  }
  updateDockEmptyState();
  return DOCKS.left.frames.length + DOCKS.right.frames.length > 0;
}
function resetLayout(){
  try{ localStorage.removeItem(LAYOUT_KEY); }catch(e){}
  DOCKS.left.el.style.width = ''; DOCKS.right.el.style.width = '';
  buildDefaultLayout(); saveLayout(); buildPanelsMenu();
}
function layoutPanels(){ if(!restoreLayout()) buildDefaultLayout(); buildPanelsMenu(); }

/* ---- Panels menu (show/hide + reset) ------------------------------------- */
const panelsPop = document.getElementById('panelsPop');
const panelsMenu = document.getElementById('panelsMenu');
function buildPanelsMenu(){
  panelsPop.innerHTML = '';
  for(const p of PANELS){
    const lab = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !p.hidden;
    cb.addEventListener('change', ()=>{ cb.checked ? showPanel(p) : hidePanel(p); });
    lab.appendChild(cb); lab.appendChild(document.createTextNode(' ' + p.key));
    panelsPop.appendChild(lab);
  }
  const sep = document.createElement('div'); sep.className = 'sep'; panelsPop.appendChild(sep);
  const reset = document.createElement('button'); reset.className = 'mbtn'; reset.textContent = '↺ Reset layout';
  reset.addEventListener('click', ()=>{ resetLayout(); panelsMenu.classList.remove('open'); });

}
document.getElementById('btnPanels').addEventListener('click', e=>{ e.stopPropagation(); panelsMenu.classList.toggle('open'); });
document.addEventListener('click', e=>{ if(!panelsMenu.contains(e.target)) panelsMenu.classList.remove('open'); });

// A labelled slider bound to a getter/setter so it works for nested state too.
function addSlider(parent, opts){
  const {label, min, max, step, get, set, fmt, swatch} = opts;
  const wrap = document.createElement('div'); wrap.className = 'ctrl';
  const fmtFn = fmt || (v => (v>0?'+':'') + v.toFixed(2));
  wrap.innerHTML =
    `<div class="row"><label>${label}</label><span class="val"></span></div>`;
  const input = document.createElement('input');
  input.type='range'; input.min=min; input.max=max; input.step=step;
  input.value = get();
  wrap.appendChild(input);
  const val = wrap.querySelector('.val');
  // optional live colour chip (used by the split-toning hue rows)
  let chip = null;
  if(swatch){
    chip = document.createElement('span'); chip.className = 'swatch';
    wrap.querySelector('.row').insertBefore(chip, val);
  }
  const refresh = ()=>{
    val.textContent = fmtFn(get());
    if(chip) chip.style.background = swatch(get());
  };
  refresh();
  input.addEventListener('input', ()=>{
    set(parseFloat(input.value)); refresh(); render(); commitChange();
  });
  // allow external refresh (used by HSL band switching + global reset)
  input._refresh = ()=>{ input.value = get(); refresh(); };
  parent.appendChild(wrap);
  return input;
}

// 3-way colour wheel control bound to grade[key] = {x,y,level}.
function addWheel(parent, key, name){
  const unit = document.createElement('div'); unit.className='wheel-unit';
  unit.innerHTML = `<div class="name">${name}</div>
    <div class="wheel"><div class="knob"></div></div>`;
  parent.appendChild(unit);

  const wheel = unit.querySelector('.wheel');
  const knob  = unit.querySelector('.knob');
  // Read the state live via grade[key] so it survives a "Reset Grade"
  // (which replaces the whole grade object).
  const st = ()=> grade[key];

  // place knob from current x,y (y up = positive)
  function place(){
    knob.style.left = (50 + st().x*50) + '%';
    knob.style.top  = (50 - st().y*50) + '%';
  }
  place();

  let dragging = false;
  function setFromEvent(e){
    const r = wheel.getBoundingClientRect();
    let nx = ( (e.clientX - r.left) / r.width  - 0.5) * 2;  //  -1..1
    let ny = -( (e.clientY - r.top ) / r.height - 0.5) * 2; //  invert (up = +)
    const len = Math.hypot(nx,ny);
    if(len > 1){ nx/=len; ny/=len; }                        // clamp to circle
    st().x = nx; st().y = ny; place(); render();
  }
  wheel.addEventListener('pointerdown', e=>{
    dragging=true; wheel.setPointerCapture(e.pointerId); setFromEvent(e);
  });
  wheel.addEventListener('pointermove', e=>{ if(dragging) setFromEvent(e); });
  wheel.addEventListener('pointerup',   ()=>{ if(dragging){ dragging=false; commitChange(); } });
  // double-click resets the wheel colour (keeps level)
  wheel.addEventListener('dblclick', ()=>{ st().x=0; st().y=0; place(); render(); commitChange(); });

  // master level slider beneath the wheel
  const lvl = document.createElement('div'); lvl.className='lvl';
  unit.appendChild(lvl);
  const lvlInput = addSlider(lvl, {
    label:'Level', min:-1, max:1, step:0.01,
    get:()=>st().level, set:v=>st().level=v
  });

  unit._replace = ()=>{ place(); lvlInput._refresh(); };
  return unit;
}

/* Interactive tone-curve editor (SVG). Edits grade.curves[activeCurve], a list
   of [x,y] control points in 0..1. Click empty space to add a point, drag to
   shape, double-click an interior point to remove it. Endpoints keep x at 0/1
   but their y (black/white point) can move. */
const CURVE_CHANNELS = [
  {key:'rgb', name:'RGB', color:'#F5F3EF'},
  {key:'r',   name:'R',   color:'#FF5A4D'},
  {key:'g',   name:'G',   color:'#4ED39B'},
  {key:'b',   name:'B',   color:'#4D9BFF'},
];
let redrawCurveEditor = ()=>{};   // set by buildCurveEditor; used by reset
function buildCurveEditor(parent){
  const NS = 'http://www.w3.org/2000/svg';

  // channel tabs
  const tabs = document.createElement('div'); tabs.className = 'curve-tabs';
  CURVE_CHANNELS.forEach(ch=>{
    const btn = document.createElement('button');
    btn.textContent = ch.name; btn.style.color = ch.color;
    if(ch.key === activeCurve) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      activeCurve = ch.key;
      [...tabs.children].forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      redraw();
    });
    tabs.appendChild(btn);
  });
  parent.appendChild(tabs);

  // the SVG pad (viewBox 0..100, y inverted so 0 is at the bottom)
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.classList.add('curve-svg');
  parent.appendChild(svg);

  // hint + per-channel reset
  const hint = document.createElement('div'); hint.className = 'curve-hint';
  hint.innerHTML = 'Click to add · drag to shape · double-click or right-click a point to remove · ';
  const reset = document.createElement('a'); reset.textContent = 'reset channel';
  reset.addEventListener('click', ()=>{
    grade.curves[activeCurve] = [[0,0],[1,1]];
    bakeCurves(); redraw(); render(); commitChange();
  });
  hint.appendChild(reset);
  parent.appendChild(hint);

  function mk(tag, attrs){
    const el = document.createElementNS(NS, tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function evToXY(e){
    const r = svg.getBoundingClientRect();
    return [ clamp01((e.clientX-r.left)/r.width),
             clamp01(1 - (e.clientY-r.top)/r.height) ];
  }
  function changed(){ bakeCurves(); redraw(); render(); commitChange(); }

  let drag = null;   // index of point being dragged
  let lastTapIdx = -1, lastTapT = 0;   // for capture-proof double-tap deletion
  function movePoint(idx, e){
    const pts = grade.curves[activeCurve];
    let [x,y] = evToXY(e);
    if(idx === 0) x = 0;
    else if(idx === pts.length-1) x = 1;
    else { const eps = 0.001;
      x = Math.min(pts[idx+1][0]-eps, Math.max(pts[idx-1][0]+eps, x)); }
    pts[idx] = [x, y];
    changed();
  }
  svg.addEventListener('pointermove', e=>{ if(drag !== null) movePoint(drag, e); });
  svg.addEventListener('pointerup',   ()=>{ drag = null; });
  // click on empty space -> add a point there and start dragging it
  svg.addEventListener('pointerdown', e=>{
    const [x,y] = evToXY(e);
    if(x <= 0.01 || x >= 0.99) return;     // don't spawn duplicate endpoints
    const pts = grade.curves[activeCurve];
    const np = [x,y]; pts.push(np); pts.sort((a,b)=>a[0]-b[0]);
    drag = pts.indexOf(np);
    svg.setPointerCapture(e.pointerId);
    changed();
  });

  function redraw(){
    const pts = grade.curves[activeCurve];
    const ch  = CURVE_CHANNELS.find(c=>c.key === activeCurve);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    for(let i=1;i<4;i++){                               // grid
      svg.appendChild(mk('line',{x1:i*25,y1:0,x2:i*25,y2:100,class:'grid'}));
      svg.appendChild(mk('line',{x1:0,y1:i*25,x2:100,y2:i*25,class:'grid'}));
    }
    svg.appendChild(mk('line',{x1:0,y1:100,x2:100,y2:0,class:'baseline'}));
    const sp = makeSpline(pts), STEPS = 64; let d = '';   // curve path
    for(let i=0;i<=STEPS;i++){
      const x = i/STEPS, y = sp(x);
      d += (i?'L':'M') + (x*100).toFixed(2) + ' ' + ((1-y)*100).toFixed(2) + ' ';
    }
    svg.appendChild(mk('path',{d, class:'curve-line', stroke:ch.color}));
    pts.forEach((p,idx)=>{                                // control points
      const dot = mk('circle',{cx:p[0]*100, cy:(1-p[1])*100, r:3.0,
        class:'curve-pt', fill:ch.color});
      const del = ()=>{ if(idx !== 0 && idx !== pts.length-1){ pts.splice(idx,1); changed(); } };
      dot.addEventListener('pointerdown', e=>{
        e.stopPropagation();
        const now = performance.now();
        if(idx === lastTapIdx && now - lastTapT < 350){   // manual double-tap -> delete
          lastTapIdx = -1; del(); return;                 // (capture-proof; no drag)
        }
        lastTapIdx = idx; lastTapT = now;
        drag = idx; svg.setPointerCapture(e.pointerId);
      });
      dot.addEventListener('contextmenu', e=>{ e.preventDefault(); e.stopPropagation(); del(); });
      svg.appendChild(dot);
    });
  }
  redrawCurveEditor = redraw;
  redraw();
}

/* Reference look-match panel: load a reference still (button / click thumb /
   drop), measure its YCbCr stats, and expose an Amount blend. */
function buildMatchUI(parent){
  const row = document.createElement('div'); row.className = 'match-row';
  const thumb = document.createElement('div'); thumb.className = 'match-thumb';
  thumb.textContent = 'no ref';
  const col = document.createElement('div'); col.className = 'col';
  const btn = document.createElement('button'); btn.className = 'btn';
  btn.textContent = 'Load Reference'; btn.style.width = '100%';
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.hidden = true;
  col.appendChild(btn); col.appendChild(input);
  row.appendChild(thumb); row.appendChild(col);
  parent.appendChild(row);

  const amt = addSlider(parent, {label:'Amount', min:0, max:1, step:0.01,
    get:()=>grade.match.amount, set:v=>{ grade.match.amount = v; applyMatch(); },
    fmt:v=>Math.round(v*100)+'%'});
  sliderRefs.push(amt);

  const hint = document.createElement('div'); hint.className = 'curve-hint';
  hint.innerHTML = 'Sets white balance / exposure / contrast / saturation to match the reference — the sliders move, so you can fine-tune. ';
  const clear = document.createElement('a'); clear.textContent = 'clear reference';
  hint.appendChild(clear);
  parent.appendChild(hint);

  function showThumb(img){
    const c = document.createElement('canvas'); c.width = 54; c.height = 54;
    drawCover(c.getContext('2d'), img, 54, 54);
    thumb.innerHTML = ''; thumb.appendChild(c); thumb.classList.add('has-ref');
  }
  function loadRef(file){
    if(!file) return;
    const img = new Image();
    img.onload = ()=>{
      if(!matchBase){                    // capture pre-match grade once
        matchBase = {temp:grade.temp, tint:grade.tint, exposure:grade.exposure,
                     contrast:grade.contrast, saturation:grade.saturation};
      }
      refStats = computeStats(img, 0);   // reference is a display still
      showThumb(img);
      if(grade.match.amount === 0){ grade.match.amount = 1; amt._refresh(); } // auto-apply
      applyMatch();                      // write the match into the controls
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  }
  btn.addEventListener('click', ()=>input.click());
  thumb.addEventListener('click', ()=>input.click());
  input.addEventListener('change', e=>loadRef(e.target.files[0]));
  ['dragover','drop'].forEach(ev=>thumb.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation();
    if(ev === 'drop' && e.dataTransfer.files[0]) loadRef(e.dataTransfer.files[0]);
  }));
  clear.addEventListener('click', ()=>{
    grade.match.amount = 0; applyMatch();   // Amount 0 -> restores the baseline
    refStats = null; matchBase = null;
    thumb.innerHTML = 'no ref'; thumb.classList.remove('has-ref');
    amt._refresh(); render();
  });
  // Global Reset Grade clears the loaded reference too (state lives here).
  resetMatchUI = ()=>{
    refStats = null; matchBase = null;
    thumb.innerHTML = 'no ref'; thumb.classList.remove('has-ref');
  };
}

// Deep-merge a preset's partial `set` onto a base grade (arrays replace).
function deepAssign(dst, src){
  for(const k in src){
    const v = src[k];
    if(v && typeof v === 'object' && !Array.isArray(v)) deepAssign(dst[k], v);
    else dst[k] = Array.isArray(v) ? v.slice() : v;
  }
}
function buildPresetGrade(p){ const g = defaultGrade(); deepAssign(g, p.set); return g; }

// Live grade = neutral blended toward the preset target by t (0..1). Tone
// curves stay identity and reference-match stays off (a clean preset look).
function effectiveGrade(target, t){
  const g = defaultGrade();
  const L = (a,b)=> a + (b-a)*t;          // neutral default for these fields is 0
  ['temp','tint','exposure','contrast','highlights','shadows','whites','blacks',
   'saturation','vibrance','fade','fadeRolloff'].forEach(k=> g[k] = L(0, target[k]));
  ['lift','gamma','gain'].forEach(k=>{
    g[k] = {x:L(0,target[k].x), y:L(0,target[k].y), level:L(0,target[k].level)};
  });
  for(let i=0;i<7;i++){
    g.hsl.hue[i] = L(0, target.hsl.hue[i]);
    g.hsl.sat[i] = L(0, target.hsl.sat[i]);
    g.hsl.lum[i] = L(0, target.hsl.lum[i]);
  }
  g.split.shadowHue = target.split.shadowHue;  // hues are fixed; their sat fades in
  g.split.highHue   = target.split.highHue;
  g.split.shadowSat = L(0, target.split.shadowSat);
  g.split.highSat   = L(0, target.split.highSat);
  g.split.balance   = L(0, target.split.balance);
  return g;
}

/* --------------------------------------------------------------------------
   SCOPES (Phase 9) — live RGB histogram of the graded preview.
   Decoupled from input rate: render() flags scopesDirty, a rAF loop redraws.
   -------------------------------------------------------------------------- */
let scopesDirty = true, scopesDraw = ()=>{};
function buildScopesUI(parent){
  // Mode selector: Histogram / Waveform / RGB Parade / Vectorscope
  const sel = document.createElement('select'); sel.className = 'space-select';
  ['Histogram','Waveform (luma)','RGB Parade','Vectorscope'].forEach((n,i)=>{
    const o = document.createElement('option'); o.value = i; o.textContent = n; sel.appendChild(o); });
  parent.appendChild(sel);

  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 120;
  cv.className = 'scope-canvas'; parent.appendChild(cv);
  const ctx = cv.getContext('2d');
  // Source pixels: downsample the rendered canvas into a 256x128 buffer.
  const SW = 256, SH = 128;
  const tmp = document.createElement('canvas'); tmp.width = SW; tmp.height = SH;
  const tctx = tmp.getContext('2d');

  let mode = 0;
  const HEIGHTS = [120, 180, 180, 256];
  sel.addEventListener('change', ()=>{ mode = parseInt(sel.value, 10); cv.height = HEIGHTS[mode]; scopesDirty = true; });

  function clearBG(H, c){ ctx.fillStyle = c || '#111'; ctx.fillRect(0,0,256,H); }

  // y position (top = bright) for a 0..255 value in a scope of height H
  const yFor = (v,H)=> Math.min(H-1, Math.round((255-v)/255*(H-1)));

  function drawHistogram(data){
    const H = cv.height, B = new Uint32Array(3*256);
    for(let i=0;i<data.length;i+=4){ B[data[i]]++; B[256+data[i+1]]++; B[512+data[i+2]]++; }
    let mx = 1; for(let ch=0;ch<3;ch++) for(let x=1;x<255;x++){ const v=B[ch*256+x]; if(v>mx) mx=v; }
    clearBG(H);
    ctx.globalCompositeOperation = 'lighter';
    const cols = ['#ff4d4d','#4ed39b','#4d9bff'];
    for(let ch=0;ch<3;ch++){ ctx.fillStyle = cols[ch];
      for(let x=0;x<256;x++){ const h = Math.min(H-2, B[ch*256+x]/mx*(H-2)); ctx.fillRect(x,H-h,1,h); } }
    ctx.globalCompositeOperation = 'source-over';
  }

  // shared: build an intensity image then paint IRE grid lines on top
  function paintGrid(H){
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1;
    for(const p of [0,0.25,0.5,0.75,1]){ const y = Math.round(p*(H-1)) + 0.5;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke(); }
  }

  function drawWaveform(data){
    const W = 256, H = cv.height, buf = new Float32Array(W*H);
    for(let py=0;py<SH;py++) for(let x=0;x<SW;x++){ const i=(py*SW+x)*4;
      const L = 0.2126*data[i] + 0.7152*data[i+1] + 0.0722*data[i+2];
      buf[yFor(L,H)*W + x]++; }
    const img = ctx.createImageData(W,H);
    for(let k=0;k<W*H;k++){ const v=buf[k], o=k*4; img.data[o+3]=255;
      if(v>0){ const g=Math.min(255,40+v*55); img.data[o]=g*0.35; img.data[o+1]=g; img.data[o+2]=g*0.45; }
      else   { img.data[o]=img.data[o+1]=img.data[o+2]=17; } }
    ctx.putImageData(img,0,0); paintGrid(H);
  }

  function drawParade(data){
    const W = 256, H = cv.height, secW = 85;
    const img = ctx.createImageData(W,H);
    for(let k=0;k<W*H;k++){ const o=k*4; img.data[o]=img.data[o+1]=img.data[o+2]=17; img.data[o+3]=255; }
    for(let ch=0;ch<3;ch++){ const xbase = ch*secW, buf = new Float32Array(secW*H);
      for(let py=0;py<SH;py++) for(let col=0;col<SW;col++){ const c = data[(py*SW+col)*4+ch];
        const sx = Math.min(secW-1, (col*secW/SW)|0); buf[yFor(c,H)*secW + sx]++; }
      for(let y=0;y<H;y++) for(let sx=0;sx<secW;sx++){ const v=buf[y*secW+sx]; if(v<=0) continue;
        const o=(y*W + xbase+sx)*4, inten=Math.min(255,40+v*55); img.data[o+ch]=inten; } }
    ctx.putImageData(img,0,0); paintGrid(H);
  }

  function drawVectorscope(data){
    const W = 256, H = 256, S = 110;     // S = chroma scale (100% bars land near r~90)
    const img = ctx.createImageData(W,H);
    for(let k=0;k<W*H;k++){ const o=k*4; img.data[o]=img.data[o+1]=img.data[o+2]=12; img.data[o+3]=255; }
    for(let p=0;p<data.length;p+=4){ const r=data[p],g=data[p+1],b=data[p+2];
      const Y=0.299*r+0.587*g+0.114*b, u=(b-Y)/255, v=(r-Y)/255;
      const x=(128+u*S)|0, y=(128-v*S)|0; if(x<0||x>255||y<0||y>255) continue;
      const o=(y*256+x)*4; img.data[o+1]=Math.min(255,img.data[o+1]+55);
      img.data[o]=Math.min(170,img.data[o]+18); img.data[o+2]=Math.min(170,img.data[o+2]+18); }
    ctx.putImageData(img,0,0);
    // graticule + colour targets
    ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(128,128,98,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(128,12); ctx.lineTo(128,244); ctx.moveTo(12,128); ctx.lineTo(244,128); ctx.stroke();
    ctx.font='9px '+'monospace'; ctx.fillStyle='rgba(255,255,255,.65)';
    for(const t of [[255,0,0,'R'],[255,255,0,'Yl'],[0,255,0,'G'],[0,255,255,'Cy'],[0,0,255,'B'],[255,0,255,'Mg']]){
      const Y=0.299*t[0]+0.587*t[1]+0.114*t[2], u=(t[2]-Y)/255, v=(t[0]-Y)/255;
      const x=128+u*S, y=128-v*S; ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.strokeRect(x-4,y-4,8,8);
      ctx.fillText(t[3], x+6, y+3); }
  }

  const DRAW = [drawHistogram, drawWaveform, drawParade, drawVectorscope];
  scopesDraw = ()=>{
    if(!canvas.width) return;
    tctx.clearRect(0,0,SW,SH); tctx.drawImage(canvas, 0,0,SW,SH);
    let data; try{ data = tctx.getImageData(0,0,SW,SH).data; }catch(e){ return; }
    DRAW[mode](data);
  };
}
function scopesTick(){ if(scopesDirty){ scopesDirty = false; scopesDraw(); } requestAnimationFrame(scopesTick); }

      row.append(nm, ap, del); looksList.appendChild(row);

/* --------------------------------------------------------------------------
   AUTO VARIATIONS (Phase 6)
   Each variation is a small delta applied on top of the CURRENT grade. We
   render the current image through each variant into a thumbnail; clicking a
   thumbnail commits that delta to the live grade.
   -------------------------------------------------------------------------- */
const VARIATIONS = [
  {name:'Warmer',  d:g=>{ g.temp+=0.15; }},
  {name:'Cooler',  d:g=>{ g.temp-=0.15; }},
  {name:'Brighter',d:g=>{ g.exposure+=0.30; }},
  {name:'Punchy',  d:g=>{ g.contrast+=0.15; g.vibrance+=0.12; }},
  {name:'Soft',    d:g=>{ g.contrast-=0.15; g.fade+=0.12; }},
  {name:'Moody',   d:g=>{ g.exposure-=0.22; g.shadows-=0.10;
                          g.split.shadowHue=210; g.split.shadowSat+=0.12; }},
  {name:'Teal/Org',d:g=>{ g.split.shadowHue=195; g.split.shadowSat+=0.14;
                          g.split.highHue=40; g.split.highSat+=0.14; }},
  {name:'Faded',   d:g=>{ g.fade+=0.28; g.fadeRolloff+=0.16; g.contrast-=0.08; }},
  {name:'Greener', d:g=>{ g.tint-=0.14; g.hsl.sat[3]+=0.12; }},
];
const cloneGrade = g => JSON.parse(JSON.stringify(g));   // grade is plain data

let refreshVariations = ()=>{};   // set by buildVariationsUI; called on changes
function buildVariationsUI(parent){
  const grid = document.createElement('div'); grid.className = 'var-grid';
  parent.appendChild(grid);
  const cells = VARIATIONS.map(v=>{
    const cell = document.createElement('div'); cell.className = 'var-cell';
    const c = document.createElement('canvas'); c.width = 90; c.height = 60;
    const label = document.createElement('div'); label.className = 'vlabel';
    label.textContent = v.name;
    cell.appendChild(c); cell.appendChild(label); grid.appendChild(cell);
    cell.addEventListener('click', ()=>{
      const ng = cloneGrade(grade); v.d(ng); grade = ng;
      syncUI(); render(); refreshVariations(); commitChange();
    });
    return {v, ctx:c.getContext('2d')};
  });

  // Render every variation thumbnail off the current grade (full, not split).
  refreshVariations = ()=>{
    if(!program) return;
    const savedGrade = grade, savedVM = viewMode;
    viewMode = 0;
    for(const cell of cells){
      grade = cloneGrade(savedGrade); cell.v.d(grade);
      render();
      cell.ctx.clearRect(0,0,90,60);
      drawCover(cell.ctx, canvas, 90, 60);
    }
    grade = savedGrade; viewMode = savedVM; render();
  };
}

  sliderRefs.push(addSlider(b,{label:'Shadow Hue',min:0,max:360,step:1,
    get:()=>grade.split.shadowHue,set:v=>grade.split.shadowHue=v,
    fmt:hueFmt, swatch:hueColor}));
  sliderRefs.push(addSlider(b,{label:'Shadow Strength',min:0,max:1,step:0.01,
    get:()=>grade.split.shadowSat,set:v=>grade.split.shadowSat=v, fmt:satFmt}));
  sliderRefs.push(addSlider(b,{label:'Highlight Hue',min:0,max:360,step:1,
    get:()=>grade.split.highHue,set:v=>grade.split.highHue=v,
    fmt:hueFmt, swatch:hueColor}));
  sliderRefs.push(addSlider(b,{label:'Highlight Strength',min:0,max:1,step:0.01,
    get:()=>grade.split.highSat,set:v=>grade.split.highSat=v, fmt:satFmt}));
  sliderRefs.push(addSlider(b,{label:'Balance',min:-1,max:1,step:0.01,
    get:()=>grade.split.balance,set:v=>grade.split.balance=v}));

  /* --- Faded Black (matte) --- */
  b = addSection('Faded Black');
  sliderRefs.push(addSlider(b,{label:'Fade',min:0,max:1,step:0.01,
    get:()=>grade.fade,set:v=>grade.fade=v, fmt:v=>Math.round(v*100)+'%'}));
  sliderRefs.push(addSlider(b,{label:'Highlight Rolloff',min:0,max:1,step:0.01,
    get:()=>grade.fadeRolloff,set:v=>grade.fadeRolloff=v,
    fmt:v=>Math.round(v*100)+'%'}));

  /* --- Auto Variations (Phase 6) --- */
  b = addSection('Variations');
  buildVariationsUI(b);

  /* --- Export LUT (Phase 8) --- */
  b = addSection('Export LUT', true);
  const tl = document.createElement('div'); tl.className = 'ctrl';
  tl.innerHTML = '<div class="row"><label>Title</label></div>';
  const tIn = document.createElement('input'); tIn.type = 'text';
  tIn.className = 'lut-title'; tIn.value = exportTitle; tIn.placeholder = 'LUT title';
  tIn.addEventListener('input', ()=> exportTitle = tIn.value);
  tl.appendChild(tIn); b.appendChild(tl);

  const sl = document.createElement('div'); sl.className = 'ctrl';
  sl.innerHTML = '<div class="row"><label>.cube size</label></div>';
  const sSel = document.createElement('select'); sSel.className = 'space-select';
  [[17,'17 — fast'],[33,'33 — standard'],[65,'65 — high']].forEach(([v,t])=>{
    const o = document.createElement('option'); o.value = v; o.textContent = t; sSel.appendChild(o); });
  sSel.value = String(exportSize);
  sSel.addEventListener('change', ()=> exportSize = parseInt(sSel.value, 10));
  sl.appendChild(sSel); b.appendChild(sl);

  const btns = document.createElement('div'); btns.className = 'export-btns';
  const bCube = document.createElement('button'); bCube.className = 'btn primary';
  bCube.textContent = 'Export .cube';
  bCube.addEventListener('click', ()=> exportCube(exportSize, exportTitle));
  const bHald = document.createElement('button'); bHald.className = 'btn';
  bHald.textContent = 'HALD .png';
  bHald.addEventListener('click', ()=> exportHald(exportTitle));
  const bCover = document.createElement('button'); bCover.className = 'btn';
  bCover.textContent = 'Cover .png';
  bCover.addEventListener('click', exportCover);
  btns.appendChild(bCube); btns.appendChild(bHald); btns.appendChild(bCover);
  b.appendChild(btns);

  const en = document.createElement('div'); en.className = 'curve-hint';
  en.textContent = 'Bakes the exact preview grade into a 3D LUT. .cube works in '
    + 'Resolve / Premiere / FCP / OBS; HALD .png works in ffmpeg / G’MIC / ImageMagick.';
  b.appendChild(en);

  /* --- LUT Pack (Phase 12) --- */
  b = addSection('LUT Pack');
  buildPackUI(b);
}
function refreshHsl(){
  hslSliders.hue._refresh();
  hslSliders.sat._refresh();
  hslSliders.lum._refresh();
}
// Push the whole grade object back into every control (after reset / preset).
function syncUI(){
  sliderRefs.forEach(s=>s._refresh());
  wheelRefs.forEach(w=>w._replace());
  refreshHsl();
  bakeCurves(); redrawCurveEditor();
}

/* --------------------------------------------------------------------------
   6b. UNDO / REDO · SAVE / LOAD .json · AUTOSAVE
   The document state is {grade, colorSpace, title}; cloneGrade() deep-copies
   the look. Edits funnel through commitChange() (debounced) which pushes a
   history snapshot and autosaves to localStorage. Undo/redo replay snapshots
   through applyState(), which pushes state back into every control.
   -------------------------------------------------------------------------- */
const AUTOSAVE_KEY = 'meatlut.autosave.v1';
function snapshot(){ return { grade: cloneGrade(grade), colorSpace, title: exportTitle }; }
function applyState(s){
  if(!s || !s.grade) return;
  grade = cloneGrade(s.grade);
  colorSpace = s.colorSpace | 0;
  if(typeof s.title === 'string'){ exportTitle = s.title;
    const ti = document.querySelector('.lut-title'); if(ti) ti.value = exportTitle; }
  const ss = document.querySelector('.space-select'); if(ss) ss.value = colorSpace;
  bakeSrcLUT();
  if(srcImage) srcStats = computeStats(srcImage, colorSpace);
  syncUI();
  render(); refreshVariations();
}

let history = [], hIndex = -1, applyingState = false, histTimer = null, autoTimer = null;
function histInit(){ history = [snapshot()]; hIndex = 0; updateUndoUI(); }
function pushHistory(){
  if(applyingState) return;
  const snap = snapshot();
  if(hIndex >= 0 && JSON.stringify(snap) === JSON.stringify(history[hIndex])) return;
  history = history.slice(0, hIndex + 1);
  history.push(snap); hIndex = history.length - 1;
  if(history.length > 120){ history.shift(); hIndex--; }
  updateUndoUI();
}
function commitChange(){
  if(applyingState) return;
  clearTimeout(histTimer); histTimer = setTimeout(pushHistory, 350);
  scheduleAutosave();
}
function scheduleAutosave(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(()=>{ try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(snapshot())); }catch(e){} }, 600);
}
function undo(){ if(hIndex <= 0) return; hIndex--; applyingState = true; applyState(history[hIndex]); applyingState = false; updateUndoUI(); scheduleAutosave(); }
function redo(){ if(hIndex >= history.length - 1) return; hIndex++; applyingState = true; applyState(history[hIndex]); applyingState = false; updateUndoUI(); scheduleAutosave(); }
function updateUndoUI(){
  const u = document.getElementById('btnUndo'), r = document.getElementById('btnRedo');
  if(u) u.disabled = hIndex <= 0;
  if(r) r.disabled = hIndex >= history.length - 1;
}
function restoreAutosave(){
  let doc = null; try{ doc = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || 'null'); }catch(e){}
  if(doc && doc.grade){ applyingState = true; applyState(doc); applyingState = false;
    setStatus('Restored your last session — Reset Grade to start fresh'); }
}
function saveProject(){
  const doc = Object.assign({ app:'meatlut', version:1, savedAt:new Date().toISOString() }, snapshot());
  downloadBlob(sanitizeName(exportTitle || 'look') + '.meatlut.json',
    new Blob([JSON.stringify(doc, null, 2)], {type:'application/json'}));
  setStatus('Saved ' + (exportTitle || 'look') + '.meatlut.json');
}
function loadProject(file){
  const r = new FileReader();
  r.onload = ()=>{ try{
      const doc = JSON.parse(r.result);
      if(!doc || !doc.grade) throw new Error('bad');
      applyState(doc); pushHistory(); scheduleAutosave();
      setStatus('Loaded ' + file.name);
    }catch(e){ setStatus('Not a valid MEAT LUT .json look file'); }
  };
  r.readAsText(file);
}
function setStatus(msg){ const el = document.getElementById('statusText'); if(el) el.textContent = msg; }

// Backend-free "cloud" sharing: the whole look is encoded into a URL hash, so a
// link restores it on any device. (True account sync would need a backend.)
function shareLink(){
  const data = btoa(unescape(encodeURIComponent(JSON.stringify(snapshot()))));
  const url = location.origin + location.pathname + '#look=' + data;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=> setStatus('Share link copied to clipboard'),
      ()=> prompt('Copy this share link:', url));
  } else prompt('Copy this share link:', url);
}
function restoreFromHash(){
  const m = /[#&]look=([^&]+)/.exec(location.hash); if(!m) return false;
  try{ const doc = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(doc && doc.grade){ applyingState = true; applyState(doc); applyingState = false;
      setStatus('Loaded look from shared link'); return true; }
  }catch(e){}
  return false;
}

/* --------------------------------------------------------------------------
   7. SPLIT SLIDER (drag the divider)
   -------------------------------------------------------------------------- */
const handle = document.getElementById('splitHandle');
const wrap   = document.getElementById('previewWrap');
function positionHandle(){ handle.style.left = (splitPos*100) + '%'; }
function updateSplitFromX(clientX){
  const r = canvas.getBoundingClientRect();
  splitPos = Math.max(0, Math.min(1, (clientX - r.left)/r.width));
  positionHandle(); render();
}
let dragSplit=false;
handle.addEventListener('pointerdown', e=>{
  dragSplit=true; handle.setPointerCapture(e.pointerId); e.preventDefault();
});
handle.addEventListener('pointermove', e=>{ if(dragSplit) updateSplitFromX(e.clientX); });
handle.addEventListener('pointerup',   ()=> dragSplit=false);

/* --------------------------------------------------------------------------
   8. TOP-BAR BUTTONS + IMAGE UPLOAD
   -------------------------------------------------------------------------- */
/* Multi-image set + motion preview (Phase 10). Loaded images live in `images`;
   the filmstrip switches between them, and motion preview auto-cycles. */
const images = [];          // { img, name }
let activeImageIndex = -1;
let motionTimer = null;
const filmstripEl = document.getElementById('filmstrip');

// ---- File decoding, incl. camera RAW via its embedded JPEG preview ----------
// Browsers can't decode RAW (ARW/CR2/NEF/DNG…), but RAW files embed a full-size
// JPEG preview — we pull the largest one out by scanning for JPEG markers.
const RAW_EXT = /\.(arw|cr2|cr3|nef|nrw|dng|raf|orf|rw2|pef|srw|sr2|raw|3fr|erf|kdc|mos|mef|iiq|x3f)$/i;
const IMG_EXT = /\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i;
function setStatus(msg){ document.getElementById('statusText').textContent = msg; }
function loadImageEl(src){
  return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; });
}
// Walk one JPEG from its SOI to its EOI. APPn segments are length-delimited, so
// an embedded EXIF thumbnail is skipped; SOS entropy data is scanned to its end.
function jpegEnd(b, start){
  let p = start + 2;
  while(p < b.length - 1){
    if(b[p] !== 0xFF){ p++; continue; }
    const m = b[p+1];
    if(m === 0xFF){ p++; continue; }                      // fill byte
    if(m === 0xD9) return p + 2;                           // EOI
    if((m >= 0xD0 && m <= 0xD7) || m === 0x01){ p += 2; continue; }  // RSTn / TEM
    if(p + 3 >= b.length) break;
    const len = (b[p+2] << 8) | b[p+3];
    if(len < 2) break;
    if(m === 0xDA){                                        // SOS -> scan to next marker
      p += 2 + len;
      while(p < b.length - 1){
        if(b[p] === 0xFF){ const n = b[p+1];
          if(n !== 0x00 && !(n >= 0xD0 && n <= 0xD7)) break; }
        p++;
      }
      continue;
    }
    p += 2 + len;
  }
  return Math.min(p, b.length);
}
async function extractEmbeddedJpeg(file){
  const b = new Uint8Array(await file.arrayBuffer());
  let best = null, bestLen = 0;
  for(let i = 0; i + 3 < b.length; ){
    if(b[i] === 0xFF && b[i+1] === 0xD8 && b[i+2] === 0xFF){
      const e = jpegEnd(b, i);
      if(e - i > bestLen){ bestLen = e - i; best = [i, e]; }
      i = e;                                               // jump past this JPEG
    } else i++;
  }
  return (best && bestLen > 2048) ? new Blob([b.subarray(best[0], best[1])], {type:'image/jpeg'}) : null;
}
// Any file -> a browser-decodable image Blob (RAW resolves to its preview JPEG).
async function fileToImageBlob(file){
  const okType = ['image/jpeg','image/png','image/webp','image/gif','image/avif','image/bmp'];
  if(okType.includes(file.type) || (IMG_EXT.test(file.name) && !RAW_EXT.test(file.name))) return file;
  return await extractEmbeddedJpeg(file);                  // RAW / unknown -> preview
}

async function addImages(fileList){
  const files = [...fileList];
  const vid = files.find(f=> f.type.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|ogg|mkv)$/i.test(f.name));
  if(vid){ loadVideo(vid); return; }            // a video takes over the preview
  const firstNew = images.length; let added = 0;
  for(const f of files){
    let blob = null;
    try { blob = await fileToImageBlob(f); } catch(e){ blob = null; }
    if(!blob){ setStatus('Cannot open ' + f.name + ' — no embedded preview / unsupported format.'); continue; }
    const url = URL.createObjectURL(blob);
    let img = null;
    try { img = await loadImageEl(url); } catch(e){ img = null; }
    URL.revokeObjectURL(url);
    if(!img){ setStatus('Could not decode ' + f.name + '.'); continue; }
    images.push({img, name: f.name || ('image ' + (images.length+1))});
    added++;
  }
  if(added){ setActiveImage(firstNew);
    setStatus('Loaded ' + added + ' image' + (added>1 ? 's' : '') + ' — WebGL2 ready'); }
}
function setActiveImage(i){
  if(i < 0 || i >= images.length) return;
  activeImageIndex = i; uploadImage(images[i].img); renderFilmstrip();
}
function removeImage(i){
  images.splice(i, 1);
  if(images.length === 0){ activeImageIndex = -1; stopMotion();
    uploadImage(makeDefaultImage()); renderFilmstrip(); return; }
  setActiveImage(Math.min(activeImageIndex, images.length-1));
}
function toggleMotion(){ motionTimer ? stopMotion() : startMotion(); }
function startMotion(){
  if(images.length < 2) return;
  motionTimer = setInterval(()=> setActiveImage((activeImageIndex+1)%images.length), 700);
  renderFilmstrip();
}
function stopMotion(){ if(motionTimer){ clearInterval(motionTimer); motionTimer = null; renderFilmstrip(); } }
function renderFilmstrip(){
  filmstripEl.innerHTML = '';
  filmstripEl.classList.toggle('empty', images.length === 0);
  if(images.length === 0) return;
  const play = document.createElement('div');
  play.className = 'play' + (motionTimer ? ' on' : '');
  play.textContent = motionTimer ? '❚❚' : '▶'; play.title = 'Motion preview';
  play.addEventListener('click', toggleMotion);
  filmstripEl.appendChild(play);
  images.forEach((im,i)=>{
    const t = document.createElement('div');
    t.className = 'film-thumb' + (i === activeImageIndex ? ' active' : '');
    const c = document.createElement('canvas'); c.width = 54; c.height = 36;
    drawCover(c.getContext('2d'), im.img, 54, 36); t.appendChild(c);
    const x = document.createElement('div'); x.className = 'x'; x.textContent = '×';
    x.addEventListener('click', e=>{ e.stopPropagation(); removeImage(i); });
    t.appendChild(x);
    t.addEventListener('click', ()=> setActiveImage(i));
    filmstripEl.appendChild(t);
  });
  renderLibrary();          // keep the Library panel's media list in sync
}

/* ---- Video footage (browser-native codecs: MP4/H.264, WebM, MOV, Ogg) ------
   The current frame becomes the live source texture; grading, scopes, export
   all work on it. Exotic codecs (ProRes/RAW/MXF) can't decode in-browser. */
let currentVideo = null;
let videoGen = 0;       // bumped per load so stale rAF loops exit (no pile-up)
const videoBar = document.getElementById('videoBar');
const vPlay = document.getElementById('vPlay');
const vSeek = document.getElementById('vSeek');
const vTime = document.getElementById('vTime');
function fmtTime(s){ s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function uploadVideoFrame(){
  if(!currentVideo || currentVideo.readyState < 2) return;
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, currentVideo);
  render();
}
function videoTick(gen){
  if(gen !== videoGen || !currentVideo) return;   // stale/cleared loop exits
  if(!currentVideo.paused && !currentVideo.ended){
    uploadVideoFrame();
    if(currentVideo.duration) vSeek.value = (currentVideo.currentTime/currentVideo.duration)*1000;
    vTime.textContent = fmtTime(currentVideo.currentTime)+' / '+fmtTime(currentVideo.duration);
  }
  requestAnimationFrame(()=> videoTick(gen));
}
function clearVideoEl(){
  if(currentVideo){ currentVideo.pause(); try{ URL.revokeObjectURL(currentVideo.src); }catch(e){} currentVideo = null; }
}
function clearVideo(){ clearVideoEl(); videoBar.style.display = 'none'; }
function loadVideo(file){
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.loop = true; v.preload = 'auto';
  v.addEventListener('error', ()=> setStatus('Cannot decode this video in-browser — try MP4/H.264, WebM or MOV/H.264.'), {once:true});
  v.addEventListener('loadeddata', ()=> setVideoSource(v, file.name), {once:true});
  v.src = URL.createObjectURL(file);
}
function setVideoSource(v, name){
  if(!v.videoWidth || !v.videoHeight){             // audio-only / undecodable track
    setStatus('No video track found in this file.'); return; }
  stopMotion(); clearVideoEl();
  const gen = ++videoGen;                          // invalidate any prior loop
  currentVideo = v; activeImageIndex = -1; srcImage = v;
  filmstripEl.classList.add('empty');             // hide stills strip while video active
  renderLibrary();
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  gl.viewport(0,0,canvas.width, canvas.height);
  document.getElementById('resText').textContent = v.videoWidth+' × '+v.videoHeight;
  videoBar.style.display = 'flex'; vPlay.textContent = '▶';
  vTime.textContent = '0:00 / '+fmtTime(v.duration);
  uploadVideoFrame();
  srcStats = computeStats(v, colorSpace);
  if(refStats && matchBase){ applyMatch(); } else { render(); refreshVariations(); }
  v.addEventListener('seeked', ()=>{ uploadVideoFrame(); srcStats = computeStats(v, colorSpace);
    if(refStats && matchBase) applyMatch(); });
  setStatus('Video loaded — ' + v.videoWidth + '×' + v.videoHeight);
  videoTick(gen);
}
vPlay.addEventListener('click', ()=>{
  if(!currentVideo) return;
  if(currentVideo.paused){ currentVideo.play(); vPlay.textContent = '❚❚'; }
  else { currentVideo.pause(); vPlay.textContent = '▶'; }
});
vSeek.addEventListener('input', ()=>{
  if(currentVideo && currentVideo.duration) currentVideo.currentTime = (vSeek.value/1000)*currentVideo.duration;
});

const fileInput = document.getElementById('fileInput');
document.getElementById('btnLoad').addEventListener('click',()=> fileInput.click());
fileInput.addEventListener('change', e=>{ addImages(e.target.files); fileInput.value = ''; });
// drag & drop anywhere over the window (supports multiple files), with overlay.
// The reference-thumb handler calls stopPropagation, so dropping a reference
// there won't also load it as a main image.
const dropOverlay = document.getElementById('dropOverlay');
let dragDepth = 0;
const hasFiles = e => Array.from(e.dataTransfer?.types || []).includes('Files');
window.addEventListener('dragenter', e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; dropOverlay.classList.add('show'); });
window.addEventListener('dragover',  e=>{ if(!hasFiles(e)) return; e.preventDefault(); });
window.addEventListener('dragleave', e=>{ if(!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth-1); if(dragDepth === 0) dropOverlay.classList.remove('show'); });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth = 0; dropOverlay.classList.remove('show');
  if(e.dataTransfer.files.length) addImages(e.dataTransfer.files);
});

function setViewMode(m){
  viewMode = m;
  const vs = document.getElementById('viewSel'); if(vs) vs.value = String(m);
  handle.style.display = (m === 2) ? 'flex' : 'none';            // wipe divider
  const showLabels = (m === 2 || m === 4);
  document.getElementById('beforeLabel').style.display = showLabels ? 'block':'none';
  document.getElementById('afterLabel').style.display  = showLabels ? 'block':'none';
  render();
}
document.getElementById('viewSel').addEventListener('change', e=> setViewMode(parseInt(e.target.value, 10)));
// `\` quickly toggles full Before / After
window.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if(e.key === '\\'){ e.preventDefault(); setViewMode(viewMode === 1 ? 0 : 1); }
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  grade = defaultGrade();
  resetPresetUI();      // clear active film-stock selection
  resetMatchUI();       // clear the loaded reference match
  syncUI();             // refresh every input (sliders, wheels, HSL, curves)
  render(); refreshVariations(); commitChange();
});

document.getElementById('btnExport').addEventListener('click', ()=>{
  exportCube(exportSize, exportTitle);
});

// Undo / redo + project save / load
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);
document.getElementById('btnSaveProj').addEventListener('click', saveProject);
const projInput = document.getElementById('projInput');
document.getElementById('btnOpenProj').addEventListener('click', ()=> projInput.click());
document.getElementById('btnShare').addEventListener('click', shareLink);
projInput.addEventListener('change', e=>{ if(e.target.files[0]) loadProject(e.target.files[0]); projInput.value=''; });
window.addEventListener('keydown', e=>{
  const t = e.target, tag = (t.tagName||'').toLowerCase();
  if(tag === 'textarea' || (tag === 'input' && t.type === 'text')) return;  // let text fields keep native undo
  const k = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); }
});

/* --------------------------------------------------------------------------
   9. INIT
   -------------------------------------------------------------------------- */
function init(){
  if(!gl) return;
  buildProgram();
  buildQuad();
  buildTexture();
  buildCurveTexture();
  buildSrcTexture();
  buildUI();
  bakeCurves();                      // identity LUT before first render
  bakeSrcLUT();                      // identity source-decode before first render
  layoutPanels();                    // build the docked, tabbed workspace
  uploadImage(makeDefaultImage());   // show something immediately
  positionHandle();
  scopesTick();                      // start the scopes refresh loop
  document.getElementById('statusText').textContent = 'WebGL2 ready — all phases ✓';
  if(!restoreFromHash()) restoreAutosave();   // a shared link wins over autosave
  histInit();                        // seed undo history with the current state
}
init();
</script>
