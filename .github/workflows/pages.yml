name: Deploy to GitHub Pages

# Publishes the single-file app (index.html) to GitHub Pages on every push to
# the listed branches, plus a manual "Run workflow" button. One-time setup:
# repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/hopeful-pasteur-mbs8qx
  workflow_dispatch:

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root — index.html is the entry point Pages serves at /.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
